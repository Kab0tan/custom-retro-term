# Builds installers on all three operating systems. Push a tag like v0.1.0 to publish a GitHub Release
# (which is also what auto-update and the APT repository read); run it manually to just get the installers as artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Only whether the secret exists: the key itself goes to the one step that needs it, not to npm's install scripts.
      HAS_APT_KEY: ${{ secrets.APT_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux: node-pty compiles from source (it ships prebuilt binaries for Windows and macOS only).
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build

      # The .deb ships the APT signing key and repository entry; its install script registers them so `apt upgrade`
      # updates the app. Skipped (the .deb just doesn't register anything) without the APT_SIGNING_KEY secret.
      - name: APT repository files for the .deb
        if: runner.os == 'Linux' && env.HAS_APT_KEY == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: bash scripts/apt-repo.sh package-files build/apt

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: add these repository secrets to sign (and, on macOS, notarize).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty secrets must be unset, or electron-builder tries to sign with nothing.
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUBLISH=always; else PUBLISH=never; fi
          npx electron-builder --publish "$PUBLISH"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: ignore

  # Turns the release into a signed APT repository: apt reads it at .../releases/latest/download/
  # (docs/packaging.md#apt-repository). Needs the APT_SIGNING_KEY secret; without it, this job does nothing.
  apt:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HAS_APT_KEY: ${{ secrets.APT_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_APT_KEY == 'true'

      - uses: actions/download-artifact@v4
        if: env.HAS_APT_KEY == 'true'
        with:
          name: installers-ubuntu-latest
          path: installers

      - name: Build and sign the repository
        if: env.HAS_APT_KEY == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          bash scripts/apt-repo.sh index installers apt-repo

      # electron-builder created the release (a draft until you publish it); add the repository files to it.
      - name: Upload to the release
        if: env.HAS_APT_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" apt-repo/* --clobber --repo "$GITHUB_REPOSITORY"
